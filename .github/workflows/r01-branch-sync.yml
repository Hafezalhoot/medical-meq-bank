name: Temporary R01 draft branch source sync

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/r01-branch-sync.yml']

permissions:
  contents: write

concurrency:
  group: r01-draft-source-sync
  cancel-in-progress: false

jobs:
  source-sync:
    if: github.event.pull_request.number == 93 && github.head_ref == 'feature/study-recovery-a-20261111' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply only the pinned source integration and remove transfer files
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch='feature/study-recovery-a-20261111'
          test "$(git rev-parse HEAD^)" = '759531b32ec0eb75fa4e24149ea2c11bc481bbab'
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$EXPECTED_HEAD"
          git diff --quiet 759531b32ec0eb75fa4e24149ea2c11bc481bbab HEAD -- tmp-r01-apply.py
          python3 tmp-r01-apply.py
          git rm -- tmp-r01-apply.py tmp-r01-transfer/part1.txt tmp-r01-transfer/part2.txt .github/workflows/study-recovery-evidence.yml
          git add -- src tests build.sh tools/build_app.py service-worker.js version.json playwright.webkit.config.js
          if git diff --cached --name-only | grep -E '^(lectures/|courses/|assets/|icons/|dist/)'; then
            echo 'Unexpected protected content edit; no commit or push.'; exit 1
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(r01): canonical Library entry, scoped navigation and source-preservation coverage'
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$branch"
          echo 'Source integration committed to draft branch only. No build/deploy was run with write permissions.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Delete this temporary workflow with the connector, then require the normal exact-head read-only test matrix.' >> "$GITHUB_STEP_SUMMARY"
