name: Migrate Readable Print Manager

on:
  push:
    branches:
      - agent/harden-pwa-ci-foundation
    paths:
      - .github/workflows/migrate-print-manager.yml
      - tools/migrate_print_manager_source.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: medical-meq-print-migration
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out latest development branch
        uses: actions/checkout@v4
        with:
          ref: agent/harden-pwa-ci-foundation
          fetch-depth: 0

      - name: Synchronize with remote branch
        run: |
          set -euo pipefail
          git fetch origin agent/harden-pwa-ci-foundation
          git reset --hard origin/agent/harden-pwa-ci-foundation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Migrate print manager source
        run: python3 tools/migrate_print_manager_source.py

      - name: Build and run static gates
        run: |
          set -euo pipefail
          bash build.sh
          python3 scripts/validate_build.py
          python3 scripts/validate_mobile_filters.py
          python3 scripts/validate_runtime_extensions.py
          python3 scripts/validate_progress_resilience.py

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          node --check src/app.js
          node --check src/progress-resilience.js
          node --check src/lecture-loader.js
          node --check src/pwa-client.js
          node --check src/print-manager.js
          node --check dist/app.js
          node --check dist/progress-resilience.js
          node --check dist/lecture-loader.js
          node --check dist/pwa-client.js
          node --check dist/service-worker.js
          node --check tests/app.spec.js
          node --check tests/accessibility.spec.js
          node --check tests/performance.spec.js
          node --check tests/layout.spec.js
          node --check tests/webkit-smoke.spec.js

      - name: Install locked browser dependencies
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium webkit

      - name: Run Chromium, offline, performance, layout and WCAG suite
        run: npm run test:e2e

      - name: Run Safari and iPhone WebKit suite
        run: npx playwright test --config=playwright.webkit.config.js

      - name: Remove compressed, legacy and one-time migration files
        run: |
          set -euo pipefail
          git rm --ignore-unmatch \
            Medical_MEQ_Bank_PWA_GitHub_Pages.zip \
            print-manager.v8.css.gz.b64 \
            print-manager.v8.js.gz.b64 \
            .github/workflows/authoritative-finalizer-v3.yml \
            .github/workflows/authoritative-finalizer.yml \
            .github/workflows/certify-and-ready-pr.yml \
            .github/workflows/confirm-lazy-and-clean.yml \
            .github/workflows/externalize-extensions.yml \
            .github/workflows/final-quality-gate.yml \
            .github/workflows/final-quality-recovery.yml \
            .github/workflows/final-release-validation.yml \
            .github/workflows/integrate-progress-resilience.yml \
            .github/workflows/repository-finalizer-v2.yml \
            .github/workflows/validate-lazy-migration-2.yml \
            .github/workflows/validate-lazy-migration.yml \
            .github/workflows/validate-scrotal.yml \
            .github/workflows/migrate-print-manager.yml \
            tools/externalize_extensions.py \
            tools/finalize_repository_v2.py \
            tools/integrate_final_quality.py \
            tools/integrate_progress_resilience.py \
            tools/integrate_progress_resilience_v2.py \
            tools/migrate_print_manager_source.py \
            tools/patch_final_quality.py \
            tools/patch_final_quality_v2.py
          rm -f lazy-migration-diagnostic.txt lazy-migration-diagnostic-2.txt source-split-diagnostic.txt

      - name: Commit validated readable and clean source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize readable production source and repository hygiene"
          git pull --rebase origin agent/harden-pwa-ci-foundation
          git push origin HEAD:agent/harden-pwa-ci-foundation

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: readable-source-migration-failure
          path: |
            playwright-report
            playwright-report-webkit
            test-results
            dist
          if-no-files-found: ignore
          retention-days: 7
