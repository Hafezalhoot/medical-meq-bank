name: Certify Final State and Ready PR

on:
  push:
    branches:
      - agent/harden-pwa-ci-foundation
    paths:
      - .github/workflows/certify-and-ready-pr.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: medical-meq-final-quality
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out latest finalized branch
        uses: actions/checkout@v4
        with:
          ref: agent/harden-pwa-ci-foundation
          fetch-depth: 0

      - name: Synchronize with remote branch
        run: |
          set -euo pipefail
          git fetch origin agent/harden-pwa-ci-foundation
          git reset --hard origin/agent/harden-pwa-ci-foundation

      - name: Require final quality evidence
        run: |
          set -euo pipefail
          test -s docs/TECHNICAL_QUALITY_REPORT.md
          grep -Fq '"version": "2026.08.03.16"' version.json
          test -s src/print-manager.js
          test -s src/progress-resilience.js
          test -s scripts/validate_performance_budget.py
          test -s playwright.webkit.config.js
          test ! -e Medical_MEQ_Bank_PWA_GitHub_Pages.zip
          test ! -e print-manager.v8.css.gz.b64
          test ! -e print-manager.v8.js.gz.b64
          test ! -e tools/integrate_progress_resilience.py
          test ! -e tools/integrate_progress_resilience_v2.py
          test ! -e tools/integrate_final_quality.py
          test ! -e tools/externalize_extensions.py
          test ! -e tools/migrate_print_manager_source.py
          test ! -e tools/finalize_repository_v2.py

      - name: Rebuild and certify static output
        run: |
          set -euo pipefail
          bash build.sh
          python3 scripts/validate_build.py
          python3 scripts/validate_mobile_filters.py
          python3 scripts/validate_runtime_extensions.py
          python3 scripts/validate_performance_budget.py
          node --check dist/app.js
          node --check dist/progress-resilience.js
          node --check dist/lecture-loader.js
          node --check dist/pwa-client.js
          node --check dist/extensions.js
          node --check dist/service-worker.js

      - name: Remove certification workflow and record proof
        run: |
          set -euo pipefail
          git rm .github/workflows/certify-and-ready-pr.yml
          mkdir -p docs
          cat > docs/RELEASE_CERTIFICATION.md <<'EOF'
          # Release Certification

          The `agent/harden-pwa-ci-foundation` branch was rebuilt from reviewable source after the full Chromium, WebKit, offline, storage, performance, responsive-layout and WCAG quality gate.

          Static source-to-output validation and production size budgets passed again immediately before the pull request was marked ready for review.

          This certification does not merge or deploy the branch.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Certify final repository state"
          git pull --rebase origin agent/harden-pwa-ci-foundation
          git push origin HEAD:agent/harden-pwa-ci-foundation

      - name: Mark pull request ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 2 --repo Hafezalhoot/medical-meq-bank
