name: Finalize Bladder Cancer lecture

on:
  push:
    branches:
      - agent/add-bladder-cancer

permissions:
  contents: write

jobs:
  finalize:
    if: github.ref == 'refs/heads/agent/add-bladder-cancer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-bladder-cancer
          fetch-depth: 0

      - name: Restore validator-compatible offline batch ordering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/lecture_builder.py')
          text = path.read_text(encoding='utf-8')
          old = (
              '        "  const placeholderImage = \'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=\';\\n"\n'
              '        "  const normalize = lecture => {\\n"'
          )
          new = (
              '        "  const existingIds = new Set(lectures.map(item => item.id));\\n"\n'
              '        "  const placeholderImage = \'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=\';\\n"\n'
              '        "  const normalize = lecture => {\\n"'
          )
          if old not in text:
              raise SystemExit('Could not find offline normalizer insertion point')
          text = text.replace(old, new, 1)
          old_tail = (
              '        "  incomingLectures.forEach(normalize);\\n"\n'
              '        "  const existingIds = new Set(lectures.map(item => item.id));\\n"'
          )
          new_tail = '        "  incomingLectures.forEach(normalize);\\n"'
          if old_tail not in text:
              raise SystemExit('Could not find duplicate existingIds position')
          text = text.replace(old_tail, new_tail, 1)
          path.write_text(text, encoding='utf-8')
          PY

          bash build.sh
          python3 scripts/validate_build.py
          python3 scripts/validate_mobile_filters.py
          python3 scripts/validate_runtime_extensions.py
          python3 scripts/validate_progress_resilience.py

      - name: Commit finalizer output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/finalize-bladder-cancer.yml
          git add tools/lecture_builder.py .github/workflows/finalize-bladder-cancer.yml
          git commit -m "Finalize Bladder Cancer offline integration"
          git push origin HEAD:agent/add-bladder-cancer
