name: Validate Medical MEQ Bank

on:
  push:
    branches:
      - main
      - agent/**
      - feature/**
      - fix/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-bank-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build bank
        run: bash build.sh

      - name: Validate generated application
        run: python3 scripts/validate_build.py

      - name: Validate JavaScript syntax
        run: |
          node --check service-worker.js
          node --check review-filter.js
          node --check back-to-top.js
          find lectures -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Verify required deployment files
        run: |
          test -s dist/index.html
          test -s dist/offline/Medical_MEQ_Review_Bank_Offline.html
          test -s dist/manifest.webmanifest
          test -s dist/service-worker.js
          test -s dist/version.json

      - name: Upload generated site for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medical-meq-bank-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
