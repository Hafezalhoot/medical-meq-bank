name: Validate Medical MEQ Bank

on:
  push:
    branches:
      - main
      - agent/**
      - feature/**
      - fix/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-bank-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build bank
        run: bash build.sh

      - name: Validate generated application
        run: |
          python3 scripts/validate_build.py
          python3 scripts/validate_mobile_filters.py
          python3 scripts/validate_runtime_extensions.py

      - name: Validate JavaScript syntax
        run: |
          node --check service-worker.js
          node --check review-filter.js
          node --check responsive-sidebars.js
          node --check mobile-filters.js
          node --check search-optimization.js
          node --check back-to-top.js
          node --check tests/app.spec.js

      - name: Verify required deployment files
        run: |
          test -s dist/index.html
          test -s dist/404.html
          test -s dist/_headers
          test -s dist/offline/Medical_MEQ_Review_Bank_Offline.html
          test -s dist/manifest.webmanifest
          test -s dist/service-worker.js
          test -s dist/version.json

      - name: Upload generated site for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medical-meq-bank-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  browser-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build bank
        run: bash build.sh

      - name: Install pinned test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
