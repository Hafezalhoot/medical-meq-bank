name: Validate Medical MEQ Bank

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-bank-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build bank
        run: bash build.sh

      - name: Validate generated application and repository hygiene
        run: |
          python3 scripts/validate_build.py
          python3 scripts/validate_mobile_filters.py
          python3 scripts/validate_runtime_extensions.py
          python3 scripts/validate_progress_resilience.py
          python3 scripts/audit_repository.py
          python3 scripts/validate_repository_hygiene.py

      - name: Validate JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/progress-resilience.js
          node --check src/lecture-loader.js
          node --check src/pwa-client.js
          node --check src/print-manager.js
          node --check dist/app.js
          node --check dist/progress-resilience.js
          node --check dist/lecture-loader.js
          node --check dist/pwa-client.js
          node --check service-worker.js
          node --check review-filter.js
          node --check responsive-sidebars.js
          node --check mobile-filters.js
          node --check search-optimization.js
          node --check back-to-top.js
          node --check tests/app.spec.js
          node --check tests/accessibility.spec.js
          node --check tests/hardening.spec.js
          node --check tests/layout.spec.js
          node --check tests/mobile-filters.spec.js
          node --check tests/performance.spec.js
          node --check tests/print.spec.js
          node --check tests/service-worker-assets.spec.js
          node --check tests/webkit-smoke.spec.js
          node --check playwright.config.js
          node --check playwright.webkit.config.js

      - name: Verify required source and deployment files
        run: |
          test -s package-lock.json
          test -s src/print-manager.css
          test -s src/print-manager.js
          test -s dist/index.html
          test -s dist/app.css
          test -s dist/app.js
          test -s dist/progress-resilience.js
          test -s dist/lecture-loader.js
          test -s dist/pwa-client.js
          test -s dist/lectures/catalog.json
          test -s dist/404.html
          test -s dist/_headers
          test -s dist/offline/Medical_MEQ_Review_Bank_Offline.html
          test -s dist/manifest.webmanifest
          test -s dist/service-worker.js
          test -s dist/version.json

      - name: Upload generated site for inspection
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: medical-meq-bank-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  chromium-quality:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Build bank
        run: bash build.sh

      - name: Install locked test dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Chromium, accessibility, performance, print and offline tests
        run: npm run test:e2e

      - name: Upload Chromium report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-chromium
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  webkit-quality:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Build bank
        run: bash build.sh

      - name: Install locked test dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Safari desktop and iPhone WebKit smoke tests
        run: npx playwright test --config=playwright.webkit.config.js

      - name: Upload WebKit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-webkit
          path: |
            playwright-report-webkit
            test-results
          if-no-files-found: ignore
          retention-days: 7
