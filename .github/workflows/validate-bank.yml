name: Validate Medical MEQ Bank

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-bank-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build and run static quality gate
        run: bash build.sh

      - name: Upload generated site for inspection
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: medical-meq-bank-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  chromium-quality:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Build bank
        run: bash build.sh

      - name: Install locked test dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Chromium, accessibility, performance, print and offline tests
        run: npm run test:e2e

      - name: Upload Chromium report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-chromium
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  webkit-quality:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Build bank
        run: bash build.sh

      - name: Install locked test dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Safari desktop and iPhone WebKit smoke tests
        run: npm run test:webkit

      - name: Upload WebKit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-webkit
          path: |
            playwright-report-webkit
            test-results
          if-no-files-found: ignore
          retention-days: 7
