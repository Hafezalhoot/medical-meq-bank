name: Finalize verified course pack staging

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/course-packs-and-renal-tumors'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source branch
        uses: actions/checkout@v6
        with:
          ref: agent/course-packs-and-renal-tumors
          fetch-depth: 0

      - name: Materialize, verify and clean the source tree
        shell: bash
        run: |
          set -euxo pipefail
          if [ -d .staging ]; then
            cat .staging/heavy.b64.part00 .staging/heavy.b64.part01 .staging/heavy.b64.tail* > /tmp/heavy.b64
            base64 --decode /tmp/heavy.b64 > /tmp/heavy.tar.gz
            echo "a3aa48ae08de07dbc9ac349b5253d1b04707ee6a2bd532709106757e1e377bdd  /tmp/heavy.tar.gz" | sha256sum --check
            cat .staging/small.b64.part* > /tmp/small.b64
            base64 --decode /tmp/small.b64 > /tmp/small.tar.gz
            echo "659edc9421f09fa520b20fbd2db39fbde7d336b3b3ddeed95bd05324aa7af021  /tmp/small.tar.gz" | sha256sum --check
            tar -xzf /tmp/heavy.tar.gz -C .
            tar -xzf /tmp/small.tar.gz -C .
          fi
          rm -rf .staging
          rm -f .github/workflows/stage-course-pack.yml
          rm -f .github/workflows/stage-course-pack-diagnostics.yml
          rm -f .github/workflows/finalize-course-pack-staging.yml
          chmod +x build.sh scripts/validate_course_packs.py scripts/validate_lecture_images.py tools/build_app.py tools/lecture_builder.py
          bash build.sh
          python3 scripts/validate_build.py
          python3 scripts/validate_course_packs.py
          python3 scripts/validate_lecture_images.py
          python3 scripts/audit_repository.py
          python3 scripts/validate_repository_hygiene.py

      - name: Commit the clean reviewed source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Renal Tumours and course content packs"
          git push origin HEAD:agent/course-packs-and-renal-tumors
