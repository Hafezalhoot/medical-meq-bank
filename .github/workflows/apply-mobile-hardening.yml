          import base64
          import gzip
          import os
          from pathlib import Path

          payload = base64.b64decode(os.environ['PATCH_B64'])
          Path('tools/mobile_hardening_patch.py').write_bytes(gzip.decompress(payload))
          PYCODE
          python3 tools/mobile_hardening_patch.py

      - name: Validate source syntax
        run: |
          python3 -m py_compile tools/build_app.py scripts/validate_build.py scripts/validate_mobile_filters.py
          node --check mobile-filters.js
          node --check src/app.js
          node --check src/pwa-client.js
          node --check tests/app.spec.js
          node --check tests/layout.spec.js
          node --check tests/webkit-smoke.spec.js

