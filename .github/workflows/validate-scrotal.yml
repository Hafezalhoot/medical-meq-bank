name: Validate Scrotal Swelling

on:
  push:
    branches:
      - fix/scrotal-swelling-lecture-20260803
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build bank
        run: bash build.sh
      - name: Verify generated lecture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('dist/index.html').read_text(encoding='utf-8')
          required = [
              'urology-scrotal-swelling',
              'Scrotal Swelling',
              'urology-urinary-tract-infection',
          ]
          for value in required:
              if value not in html:
                  raise SystemExit(f'Missing generated content: {value}')
          if 'globalThis.__urolScrotalCompactGzip' in html:
              raise SystemExit('Compressed Scrotal loader leaked into generated HTML')
          if html.count('urology-scrotal-swelling') < 1:
              raise SystemExit('Scrotal lecture was not injected')
          print('Scrotal Swelling and UTI are present in dist/index.html')
          PY
