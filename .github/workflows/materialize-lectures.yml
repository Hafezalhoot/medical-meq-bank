name: Materialize Reviewable Lectures

on:
  push:
    branches:
      - agent/harden-pwa-ci-foundation
    paths:
      - .github/workflows/materialize-lectures.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: agent/harden-pwa-ci-foundation

      - name: Materialize validated lecture JSON
        run: python3 tools/materialize_lectures.py

      - name: Remove legacy compressed lecture chunks
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            lectures/neuro-tbi-[0-9][0-9].js \
            lectures/neuro-tbi-99.js \
            lectures/neuro-tbi-data-*.b64 \
            lectures/urology-scrotal-*.js \
            lectures/urology-scrotal-data-*.b64 \
            lectures/urology-uti-*.js \
            lectures/urol-emerg-*.js

      - name: Verify JSON-only lecture build
        run: |
          set -euo pipefail
          test -s lectures/catalog.json
          test "$(find lectures/data -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 4
          bash build.sh
          python3 scripts/validate_build.py
          python3 scripts/validate_mobile_filters.py
          if find lectures -maxdepth 1 -type f \( -name '*.b64' -o -name '*-99.js' \) | grep -q .; then
            echo "Legacy compressed lecture files remain."
            exit 1
          fi

      - name: Commit reviewable lecture sources
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lectures/catalog.json lectures/data
          if git diff --cached --quiet; then
            echo "Lecture sources are already materialized."
            exit 0
          fi
          git commit -m "Materialize reviewable lecture JSON sources"
          git push origin HEAD:agent/harden-pwa-ci-foundation
