name: Externalize Generated Extensions

on:
  push:
    branches:
      - agent/harden-pwa-ci-foundation
    paths:
      - .github/workflows/externalize-extensions.yml
      - tools/externalize_extensions.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: medical-meq-final-quality
  cancel-in-progress: false

jobs:
  externalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out latest development branch
        uses: actions/checkout@v4
        with:
          ref: agent/harden-pwa-ci-foundation
          fetch-depth: 0

      - name: Synchronize with remote branch
        run: |
          set -euo pipefail
          git fetch origin agent/harden-pwa-ci-foundation
          git reset --hard origin/agent/harden-pwa-ci-foundation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Externalize generated extensions
        run: python3 tools/externalize_extensions.py

      - name: Build and run all static gates
        run: |
          set -euo pipefail
          bash build.sh
          python3 scripts/validate_build.py
          python3 scripts/validate_mobile_filters.py
          python3 scripts/validate_runtime_extensions.py
          python3 scripts/validate_performance_budget.py

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          node --check src/app.js
          node --check src/progress-resilience.js
          node --check src/lecture-loader.js
          node --check src/pwa-client.js
          node --check dist/app.js
          node --check dist/progress-resilience.js
          node --check dist/lecture-loader.js
          node --check dist/pwa-client.js
          node --check dist/extensions.js
          node --check dist/service-worker.js
          node --check tests/app.spec.js
          node --check tests/accessibility.spec.js
          node --check tests/performance.spec.js
          node --check tests/layout.spec.js

      - name: Install locked browser dependencies
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run complete browser, offline, performance, layout and WCAG suite
        run: npm run test:e2e

      - name: Remove one-time extension migration files
        run: |
          set -euo pipefail
          git rm --ignore-unmatch \
            .github/workflows/externalize-extensions.yml \
            tools/externalize_extensions.py

      - name: Commit validated extension bundles
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Externalize generated feature bundles"
          git pull --rebase origin agent/harden-pwa-ci-foundation
          git push origin HEAD:agent/harden-pwa-ci-foundation

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extension-externalization-failure
          path: |
            playwright-report
            test-results
            dist
          if-no-files-found: ignore
          retention-days: 7
