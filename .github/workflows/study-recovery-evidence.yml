name: Temporary study recovery baseline evidence

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/study-recovery-evidence.yml']

permissions:
  contents: read

jobs:
  baseline-evidence:
    if: github.head_ref == 'feature/study-recovery-a-20261111' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the approved public baseline only
        uses: actions/checkout@v6
        with:
          ref: f697846aa2edbbd3aaa70eee1f063ab2392b78f3
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Package tracked history and locked test libraries without credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/study-recovery-evidence"
          git bundle create "$RUNNER_TEMP/study-recovery-evidence/baseline.bundle" HEAD
          npm ci --ignore-scripts --no-audit --no-fund
          tar -czf "$RUNNER_TEMP/study-recovery-evidence/test-libraries.tgz" node_modules
          git rev-parse HEAD > "$RUNNER_TEMP/study-recovery-evidence/source-sha.txt"
          sha256sum "$RUNNER_TEMP/study-recovery-evidence/baseline.bundle" "$RUNNER_TEMP/study-recovery-evidence/test-libraries.tgz" > "$RUNNER_TEMP/study-recovery-evidence/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v6
        with:
          name: study-recovery-baseline
          path: ${{ runner.temp }}/study-recovery-evidence/
          retention-days: 1
          if-no-files-found: error
