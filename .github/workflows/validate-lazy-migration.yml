name: Validate Lazy Lecture Migration

on:
  push:
    branches:
      - agent/harden-pwa-ci-foundation
    paths:
      - .github/workflows/validate-lazy-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: agent/harden-pwa-ci-foundation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run complete validation and capture result
        id: validation
        continue-on-error: true
        run: |
          set +e
          : > lazy-migration-diagnostic.txt
          {
            echo "Lazy lecture migration validation"
            echo "Commit: $(git rev-parse HEAD)"
            echo
            echo "== Build =="
            bash build.sh
            build_status=$?
            echo "Build status: $build_status"
            if [ "$build_status" -ne 0 ]; then exit "$build_status"; fi

            echo
            echo "== Static validation =="
            python3 scripts/validate_build.py
            static_status=$?
            python3 scripts/validate_mobile_filters.py
            mobile_status=$?
            python3 scripts/validate_runtime_extensions.py
            runtime_status=$?
            echo "Static statuses: build=$static_status mobile=$mobile_status runtime=$runtime_status"
            if [ "$static_status" -ne 0 ] || [ "$mobile_status" -ne 0 ] || [ "$runtime_status" -ne 0 ]; then exit 1; fi

            echo
            echo "== Browser dependencies =="
            npm ci --no-audit --no-fund
            npm_status=$?
            echo "npm ci status: $npm_status"
            if [ "$npm_status" -ne 0 ]; then exit "$npm_status"; fi

            npx playwright install --with-deps chromium
            browser_install_status=$?
            echo "Chromium install status: $browser_install_status"
            if [ "$browser_install_status" -ne 0 ]; then exit "$browser_install_status"; fi

            echo
            echo "== Browser and accessibility tests =="
            npm run test:e2e
            test_status=$?
            echo "Browser test status: $test_status"
            exit "$test_status"
          } >> lazy-migration-diagnostic.txt 2>&1
          status=$?
          cat lazy-migration-diagnostic.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Commit validation diagnostic
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '\nFinal status: %s\n' "${{ steps.validation.outputs.status }}" >> lazy-migration-diagnostic.txt
          git add lazy-migration-diagnostic.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record lazy lecture migration validation"
          git push origin HEAD:agent/harden-pwa-ci-foundation

      - name: Fail unsuccessful validation
        if: steps.validation.outputs.status != '0'
        run: exit 1
