name: Diagnose course pack staging

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/course-packs-and-renal-tumors'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v6
        with:
          ref: agent/course-packs-and-renal-tumors
          fetch-depth: 0

      - id: diagnose
        name: Reproduce staging with a concise log
        shell: bash
        continue-on-error: true
        run: |
          set +e
          {
            set -x
            test -d .staging
            cat .staging/heavy.b64.part00 .staging/heavy.b64.part01 .staging/heavy.b64.tail* > /tmp/heavy.b64
            base64 --decode /tmp/heavy.b64 > /tmp/heavy.tar.gz
            echo "a3aa48ae08de07dbc9ac349b5253d1b04707ee6a2bd532709106757e1e377bdd  /tmp/heavy.tar.gz" | sha256sum --check
            cat .staging/small.b64.part* > /tmp/small.b64
            base64 --decode /tmp/small.b64 > /tmp/small.tar.gz
            echo "659edc9421f09fa520b20fbd2db39fbde7d336b3b3ddeed95bd05324aa7af021  /tmp/small.tar.gz" | sha256sum --check
            tar -xzf /tmp/heavy.tar.gz -C .
            tar -xzf /tmp/small.tar.gz -C .
            rm -rf .staging
            rm -f .github/workflows/stage-course-pack.yml .github/workflows/stage-course-pack-diagnostics.yml .github/workflows/finalize-course-pack-staging.yml .github/workflows/diagnose-course-pack-staging.yml
            chmod +x build.sh scripts/validate_course_packs.py scripts/validate_lecture_images.py tools/build_app.py tools/lecture_builder.py
            bash build.sh
            python3 scripts/validate_course_packs.py
            python3 scripts/validate_lecture_images.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Add Renal Tumours and course content packs"
            git push --dry-run origin HEAD:agent/course-packs-and-renal-tumors
          } > /tmp/course-pack-diagnosis.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -c 5000 /tmp/course-pack-diagnosis.log > /tmp/course-pack-diagnosis-tail.log
          exit 0

      - name: Post diagnosis to the pull request
        uses: actions/github-script@v8
        env:
          DIAGNOSIS_EXIT: ${{ steps.diagnose.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/course-pack-diagnosis-tail.log', 'utf8');
            const marker = '<!-- course-pack-staging-diagnosis -->';
            const body = `${marker}\nStaging diagnosis exit code: **${process.env.DIAGNOSIS_EXIT}**\n\n\`\`\`text\n${log}\n\`\`\``;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const existing = comments.find(comment => comment.user.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            }
