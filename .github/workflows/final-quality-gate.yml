name: Final Architecture and Quality Gate

on:
  push:
    branches:
      - agent/harden-pwa-ci-foundation
    paths:
      - .github/workflows/final-quality-gate.yml
      - tools/integrate_final_quality.py
      - scripts/validate_performance_budget.py
      - tests/performance.spec.js
      - tests/layout.spec.js
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: medical-meq-final-quality
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out latest development branch
        uses: actions/checkout@v4
        with:
          ref: agent/harden-pwa-ci-foundation
          fetch-depth: 0

      - name: Synchronize with remote branch
        run: |
          set -euo pipefail
          git fetch origin agent/harden-pwa-ci-foundation
          git reset --hard origin/agent/harden-pwa-ci-foundation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply final quality integration
        run: |
          set -euo pipefail
          python3 tools/integrate_final_quality.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/layout.spec.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "#studyToolbar input:not([hidden]), #studyToolbar select:not([hidden]), #studyToolbar button:not([hidden])",
              ".toolbar input:not([hidden]), .toolbar select:not([hidden]), .toolbar button:not([hidden])",
          )
          marker = "  for (const rectangle of rectangles) {\n"
          addition = "  expect(rectangles.length).toBeGreaterThan(4);\n\n"
          if addition not in text:
              if marker not in text:
                  raise SystemExit('Could not strengthen mobile layout test')
              text = text.replace(marker, addition + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Build and run all static gates
        run: |
          set -euo pipefail
          bash build.sh
          python3 scripts/validate_build.py
          python3 scripts/validate_mobile_filters.py
          python3 scripts/validate_runtime_extensions.py
          python3 scripts/validate_performance_budget.py

      - name: Validate all JavaScript sources
        run: |
          set -euo pipefail
          node --check src/app.js
          node --check src/progress-resilience.js
          node --check src/lecture-loader.js
          node --check src/pwa-client.js
          node --check dist/app.js
          node --check dist/progress-resilience.js
          node --check dist/lecture-loader.js
          node --check dist/pwa-client.js
          node --check dist/service-worker.js
          node --check tests/app.spec.js
          node --check tests/accessibility.spec.js
          node --check tests/performance.spec.js
          node --check tests/layout.spec.js

      - name: Install locked browser dependencies
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run complete browser, offline, layout, performance and WCAG suite
        run: npm run test:e2e

      - name: Clean all one-time migration files
        run: |
          set -euo pipefail
          rm -f \
            lazy-migration-diagnostic.txt \
            lazy-migration-diagnostic-2.txt \
            source-split-diagnostic.txt
          git rm --ignore-unmatch \
            .github/workflows/confirm-lazy-and-clean.yml \
            .github/workflows/validate-lazy-migration.yml \
            .github/workflows/validate-lazy-migration-2.yml \
            .github/workflows/integrate-progress-resilience.yml \
            .github/workflows/final-quality-gate.yml \
            tools/integrate_progress_resilience.py \
            tools/integrate_final_quality.py

      - name: Commit validated final foundation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete resilient lazy-loading foundation and quality gates"
          git pull --rebase origin agent/harden-pwa-ci-foundation
          git push origin HEAD:agent/harden-pwa-ci-foundation

      - name: Upload final reports if a later step fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: final-quality-failure
          path: |
            playwright-report
            test-results
            dist
          if-no-files-found: ignore
          retention-days: 7
