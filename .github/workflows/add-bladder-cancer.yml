name: Add Bladder Cancer lecture

on:
  push:
    branches:
      - agent/add-bladder-cancer

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-bladder-cancer
          fetch-depth: 0

      - name: Generate lecture and update release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, json, re
          from pathlib import Path

          payload = ''''''
          lecture_path = Path('lectures/data/urology-bladder-cancer.json')
          lecture_path.write_bytes(gzip.decompress(base64.b64decode(payload)))
          lecture = json.loads(lecture_path.read_text(encoding='utf-8'))

          catalog_path = Path('lectures/catalog.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          entry = {
              'id': lecture['id'],
              'title': lecture['title'],
              'subjectKey': lecture['subjectKey'],
              'order': lecture['order'],
              'file': 'data/urology-bladder-cancer.json',
              'expectedCounts': {
                  'cases': len(lecture['cases']),
                  'coreShorts': len(lecture['coreShorts']),
                  'imageQuestions': len(lecture['imageQuestions']),
                  'detailedShorts': len(lecture['detailedShorts']),
                  'rapid': len(lecture['rapid'])
              }
          }
          catalog['lectures'] = [x for x in catalog['lectures'] if x['id'] != lecture['id']]
          catalog['lectures'].append(entry)
          catalog['lectures'].sort(key=lambda x: (x['subjectKey'], x['order']))
          catalog_path.write_text(json.dumps(catalog, indent=2) + '\n', encoding='utf-8')

          version = {'version': '2026.08.03.16', 'updatedAt': '2026-08-03T08:20:00+03:00'}
          Path('version.json').write_text(json.dumps(version, indent=2) + '\n', encoding='utf-8')

          sw = Path('service-worker.js')
          text = sw.read_text(encoding='utf-8')
          text = re.sub(r"const APP_VERSION = '[^']+';", "const APP_VERSION = '2026.08.03.16';", text, count=1)
          sw.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          marker = '5. Scrotal Swelling\n'
          if '6. Bladder Cancer' not in text:
              text = text.replace(marker, marker + '6. Bladder Cancer\n')
          readme.write_text(text, encoding='utf-8')
          PY

          python3 -m json.tool lectures/data/urology-bladder-cancer.json >/dev/null
          bash build.sh
          python3 scripts/validate_build.py
          python3 scripts/validate_mobile_filters.py
          python3 scripts/validate_runtime_extensions.py
          python3 scripts/validate_progress_resilience.py

      - name: Commit generated lecture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/add-bladder-cancer.yml
          git add lectures/data/urology-bladder-cancer.json lectures/catalog.json version.json service-worker.js README.md .github/workflows/add-bladder-cancer.yml
          git commit -m "Add Bladder Cancer lecture bank"
          git push origin HEAD:agent/add-bladder-cancer
