name: Live Cloudflare Production Smoke

on:
  push:
    branches:
      - main
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-cloudflare-production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked browser dependencies
        run: npm ci --no-audit --no-fund

      - name: Report active Cloudflare deployment (read only)
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::warning::Cloudflare API credentials unavailable; active Worker version not checked."
            exit 0
          fi
          report=$(npx --yes wrangler@4 deployments status --name medical-meq-bank)
          printf '%s\n' "$report"
          {
            echo '### Active Cloudflare Worker (read-only deployment check)'
            echo '```text'
            printf '%s\n' "$report"
            echo '```'
            echo 'This is deployment status, not a browser-level Cloudflare Access smoke result.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify actual published Cloudflare Worker
        env:
          MEQ_CF_ACCESS_CLIENT_ID: ${{ secrets.MEQ_CF_ACCESS_CLIENT_ID }}
          MEQ_CF_ACCESS_CLIENT_SECRET: ${{ secrets.MEQ_CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/production_smoke.mjs

      - name: Upload live evidence and failure screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cloudflare-production-smoke
          path: production-smoke-evidence
          if-no-files-found: warn
          retention-days: 7
