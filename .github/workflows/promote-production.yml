name: Promote approved MEQ Worker

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Fully reviewed source commit (must be on main and pass all quality checks)'
        required: true
        type: string
      worker_version_id:
        description: 'Optional Worker ID; leave blank for latest validated Cloudflare build at source_sha'
        required: false
        type: string
        default: ''
      confirm_production:
        description: 'I approve sending 100% of MEQ production traffic to this version'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  checks: read

concurrency:
  group: meq-production-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out protected main and its history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify explicit approval, version and protected quality checks
        id: eligibility
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKER_VERSION_ID: ${{ inputs.worker_version_id }}
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CONFIRM_PRODUCTION" != 'true' ]]; then
            echo '::error::Production promotion requires explicit confirmation.'
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::Enter a complete lowercase 40-character source commit SHA.'
            exit 1
          fi
          if [[ -n "$WORKER_VERSION_ID" && ! "$WORKER_VERSION_ID" =~ ^[a-f0-9]{8}-([a-f0-9]{4}-){3}[a-f0-9]{12}$ ]]; then
            echo '::error::If supplied, the Cloudflare Worker version must be a lowercase UUID.'
            exit 1
          fi
          if [[ "$SOURCE_SHA" != "$(git rev-parse HEAD)" ]]; then
            echo '::error::Source SHA must equal current protected main HEAD; refuse stale or unmerged commits.'
            exit 1
          fi
          git merge-base --is-ancestor "$SOURCE_SHA" "$GITHUB_SHA" || {
            echo '::error::The target commit is not in protected main history.'
            exit 1
          }
          source_release=$(git show "${SOURCE_SHA}:version.json" | python3 -c 'import sys,json;print(json.load(sys.stdin)["version"])')
          main_release=$(python3 -c 'import json;print(json.load(open("version.json"))["version"])')
          if [[ "$source_release" != "$main_release" ]]; then
            echo '::error::A newer application version exists on main. Refresh the release candidate.'
            exit 1
          fi
          node scripts/promotion_gate.mjs

      - name: Promote the previously built Worker version to 100% traffic
        env:
          WORKER_VERSION_ID: ${{ steps.eligibility.outputs.worker_version_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Create the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID GitHub Actions secrets first.'
            exit 1
          fi
          # Fail closed if the current active deployment cannot be identified.
          # Retain the previous active Worker ID(s) for a controlled rollback.
          previous_status=$(npx --yes wrangler@4 deployments status --name medical-meq-bank)
          {
            echo '### Previous active Worker deployment (rollback reference)'
            echo '\`\`\`text'
            printf '%s\n' "$previous_status"
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"
          npx --yes wrangler@4 versions deploy "${WORKER_VERSION_ID}@100%" \
            --name medical-meq-bank --message "Approved source ${SOURCE_SHA}" --yes
          npx --yes wrangler@4 deployments status --name medical-meq-bank
          {
            echo '### MEQ Worker promotion command completed'
            echo "- Source commit: ${SOURCE_SHA}"
            echo "- Worker version: ${WORKER_VERSION_ID}"
            echo '- Traffic target: 100% (check Wrangler status output)'
            echo '- Run the separate authenticated Live Cloudflare Production Smoke before declaring the site verified.'
          } >> "$GITHUB_STEP_SUMMARY"
