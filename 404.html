<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#174ea6">
  <title>Page not found | Medical MEQ Bank</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172b4d;background:#eef3fa}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}
    main{width:min(560px,100%);padding:40px;border-radius:24px;background:#fff;box-shadow:0 20px 60px rgba(23,78,166,.14);text-align:center}
    .code{margin:0;color:#174ea6;font-size:clamp(4rem,18vw,7rem);font-weight:900;line-height:1}
    h1{margin:18px 0 10px;font-size:clamp(1.5rem,5vw,2.25rem)}
    p{margin:0 auto 26px;max-width:44ch;color:#52657a;line-height:1.7}
    a{display:inline-flex;min-height:48px;align-items:center;justify-content:center;padding:0 22px;border-radius:12px;background:#174ea6;color:#fff;font-weight:800;text-decoration:none}
    a:focus-visible{outline:4px solid #84adff;outline-offset:4px}
    @media(prefers-color-scheme:dark){:root{color:#f2f4f7;background:#07111f}main{background:#101c2e;box-shadow:none}p{color:#b8c4d4}}
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Page not found</h1>
    <p>The address is not part of the Medical MEQ Bank. Return to the review bank to continue studying.</p>
    <a href="./">Return to the MEQ Bank</a>
  </main>
</body>
</html>
